<!doctype html>
<html lang="es">

<head>

  <!-- Basic SEO -->
  <meta charset="UTF-8" />
  <link rel="icon" href="/mainIcon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Título de respaldo: PageSeo lo reemplaza en cada página (no se duplica) -->
  <title>Zumia Solutions</title>
  <meta name="author" content="Zumia Solutions" />

  <!-- Favicon recommended standards -->
  <link rel="icon" type="image/png" sizes="32x32" href="/mainIcon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/mainIcon.png" />
  <link rel="apple-touch-icon" href="/mainIcon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <script>
    (function () {
      const redirectPath = sessionStorage.getItem("spa-fallback");
      if (!redirectPath) return;
      sessionStorage.removeItem("spa-fallback");

      const url = new URL(redirectPath, window.location.origin);
      const newUrl = url.pathname + url.search + url.hash;
      const currentUrl =
        window.location.pathname +
        window.location.search +
        window.location.hash;

      if (newUrl !== currentUrl) {
        window.history.replaceState(null, "", newUrl);
      }
    })();
  </script>
</head>

<body style="margin:0">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
