<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirigiendo…</title>
  <script>
    (function () {
      const redirectPath =
        window.location.pathname +
        window.location.search +
        window.location.hash;

      sessionStorage.setItem("spa-fallback", redirectPath);
      window.location.replace("/");
    })();
  </script>
</head>

<body>
  <p>Redirigiendo…</p>
  <noscript>
    <p>Este sitio necesita JavaScript. Vuelve a la página de inicio.</p>
    <!-- Solo se ve sin JavaScript: con JavaScript, el script de arriba ya redirigió -->
    <nav aria-label="Páginas del sitio">
      <ul>
        <li><a href="/">Inicio</a></li>
        <li><a href="/services/">Servicios</a></li>
        <li><a href="/blog/">Blog</a></li>
        <li><a href="/contact/">Contacto</a></li>
      </ul>
    </nav>
  </noscript>
</body>

</html>
